# TEMPORARY probe. Identical to probe-b but with the 'on' key QUOTED - unquoted 'on' is boolean true in YAML 1.1, so this rules out a parser quirk.
# Does nothing: no data, no Telegram, no commits.
name: probe-d
"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "workflow=probe-d cron=*/5 * * * *"
          echo "fired $(date -u '+%F %T') UTC  trigger=${{ github.event_name }}"
